<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Office — researched London venues</title><style>
body{margin:0;background:#f6f7f8;color:#17212d;font:15px system-ui,Arial,sans-serif}header,main{max-width:1050px;margin:auto;padding:20px}header h1{font-size:27px}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd3da}button{cursor:pointer;background:#17212d;color:#fff}form{display:flex;gap:10px;flex-wrap:wrap}article{padding:16px;border:1px solid #e1e4e8;border-radius:12px;background:white;margin:12px 0}small{color:#54616f}.meta{display:flex;flex-wrap:wrap;gap:12px}a{color:#075ea8}strong{font-weight:650}.warn{color:#764d00}#askResult,#status{white-space:pre-wrap}</style></head><body>

<form id="filters"><input name="q" aria-label="Find a venue" placeholder="Name, area or postcode"><select name="after18"><option value="">Any evening policy</option><option value="yes">Evening hire advertised</option></select><select name="weekend"><option value="">Any weekend policy</option><option value="yes">Weekend hire advertised</option></select><button>Filter</button></form>
<p id="status" aria-live="polite"></p><div id="results"></div><h2>Ask the research graph</h2><form id="ask"><input id="question" size="54" maxlength="300" placeholder="Which venues mention evening access?" required><button>Search Cognee</button></form><div id="askResult" aria-live="polite"></div>
</main><script type="module" src="/venues/client.js"></script></body></html>
