name: Contributor scope
on: pull_request
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check contributor paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 scripts/check_scope.py --base "$BASE_SHA" --branch "$HEAD_BRANCH"
